# Shikigami's deployment, rendered by Argo CD with Meru's nuwa-app chart (>= 0.5.0). CI writes the image after each
# build. Until the first one, the digest is a placeholder: Argo can still render the app (so the build namespace and
# runner come up and make that first build), and the pod is refused - no image carries Shikigami's signature yet.
name: shikigami
owner: mario
image:
  repository: zot.clockmost.com/meru/shikigami
  digest: sha256:688b4d721ffdd16fa2648489639eb826991869afae99b634689b1e0131fe858d
  tag: "397646b5b0d4"
port: 8080
# Fixed, so Gitea (outside the cluster) can send Meru/requests' webhook to http://10.43.0.60/ping.
clusterIP: 10.43.0.60
heartbeat:
  readyPath: /ready # Temporal answers over mTLS
# Its Gitea bot (Read on Meru/requests, D63), from OpenBao apps/meru/shikigami/eso/gitea through ESO (D66).
secretEnv:
  SHIKIGAMI_GITEA_TOKEN:
    secret: gitea
    key: token
  # D125: its GlitchTip API token (project:read + project:write), from its request's D123 change (Meru/requests#38).
  SHIKIGAMI_GLITCHTIP_TOKEN:
    secret: env-20261105-7f03b1
    key: glitchtip-token
externalSecrets:
  gitea: {}
  env-20261105-7f03b1: {}
# Its Authentik login for Temporal + Thoth tokens: its own Kubernetes token (D104) - the groups in the protected
# blueprints (infra shikigami.yaml, thoth.yaml) list shikigami/shikigami. Nothing stored anywhere.
authentikLogin:
  enabled: true
# Its client certificate for Temporal's front door (D70), mounted where the settings look (tls_dir).
certificate:
  enabled: true
openbaoLogin:
  enabled: true # OnboardBuild writes build credentials with Shikigami's own OpenBao login (D79)
kubernetesApi:
  enabled: true # the retire pass reads Argo CD Applications (D85; Meru/meru rbac/: get applications only)
# More workers while app steps queue up (D75): KEDA polls /backlog, one replica per 5 waiting tasks, 1 to 4.
autoscaling:
  enabled: true
# Size medium (its request in Meru/requests): ~85 MiB before any work.
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi
# Who may connect (D97): the host side - Caddy, Gitea and Zabbix are still Docker containers, so their addresses,
# plus the node for the kubelet's probes - Janus (/validate), KEDA (/backlog) and Xolotl (/ping). Everything else in the cluster is refused. When Caddy and Gitea move
# into the cluster (D24) the Docker range goes for their namespaces.
networkPolicy:
  enabled: true
  fromNamespaces: [janus, keda, xolotl]

# Crash reports (D125): this app's GlitchTip project, which Shikigami made (it predates the marker's own DSN line).
glitchtip:
  dsn: https://8bbad38e4dc94b55915966ee197b4a57@glitchtip.clockmost.com/4
