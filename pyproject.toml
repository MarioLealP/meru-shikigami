[project]
name = "shikigami"
version = "0.1.0"
description = "Meru's orchestrator: turns requests into running apps"
readme = "README.md"
authors = [
    { name = "MarioGLealP", email = "lealmariop@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "temporalio>=1.35.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
shikigami-validate = "shikigami.validate:main"
shikigami-schema = "shikigami.schema:main"
shikigami-run = "shikigami.main:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
