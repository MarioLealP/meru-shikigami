[project]
name = "shikigami"
version = "0.1.0"
description = "Meru's orchestrator: turns requests into running apps"
readme = "README.md"
authors = [
    { name = "MarioGLealP", email = "lealmariop@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.2",
    "pyyaml>=6.0.3",
]

[project.scripts]
shikigami-validate = "shikigami.validate:main"
shikigami-schema = "shikigami.schema:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
