[project]
name = "shikigami"
version = "0.1.0"
description = "Meru's orchestrator: turns requests into running apps"
readme = "README.md"
authors = [
    { name = "MarioGLealP", email = "lealmariop@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.74.0",
    "temporalio>=1.35.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
shikigami-validate = "shikigami.validate:main"
shikigami-schema = "shikigami.schema:main"
shikigami-run = "shikigami.main:main"
shikigami-bootstrap = "shikigami.bootstrap:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "Q", "C4", "FAST", "N", "PT", "ERA", "D", "complex-structure", "S"]
ignore = [
    "undocumented-public-init",
    # From S, the rules that guess from a name or an import: on Meru's code they only raised false alarms.
    "assert",
    "hardcoded-bind-all-interfaces",
    "hardcoded-password-string",
    "start-process-with-partial-path",
    "subprocess-without-shell-equals-true",
    "suspicious-subprocess-import",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "unused-async"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
